[project]
name = "labguard"
version = "0.1.0"
description = "Local-only authorized Web security learning lab"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "SQLAlchemy==2.1.4", "httpx==0.28.1", "PyYAML==6.0.3", "alembic==1.20.0", "psycopg[binary]==3.3.6", "waitress==3.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

