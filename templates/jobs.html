{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CONTROLLED CHECKS</div><h1>檢查工作<span class="heading-dot">.</span></h1><p class="muted">選擇固定資產與檢查類型，讓每次驗證都有紀錄。</p></div><a class="button secondary" href="/jobs">重新整理</a></div>
<section class="card"><h2>建立受控檢查</h2><p class="muted">每秒最多 2 個請求、單一 worker、每工作 45 秒。XSS 檢查會新增一則假留言。</p><form method="post" class="form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><label>實驗資產<select name="asset_id">{% for a in assets %}<option value="{{ a.id }}">#{{ a.id }} {{ a.key }}</option>{% endfor %}</select></label><label>檢查項目<select name="check_type">{% for key,label in checks.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>授權範圍<select name="scope_id">{% for s in scopes %}<option value="{{ s.id }}">{{ s.name }}（{{ '啟用' if s.enabled else '尚未啟用' }}）</option>{% endfor %}</select></label><button class="button">加入佇列 →</button></form></section>
<section class="card section-gap"><div class="card-heading"><h2>工作紀錄</h2><span class="tag">{{ jobs|length }} 筆</span></div>{% include '_job_table.html' %}</section>{% endblock %}
